<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<title>HTF | Bodyweight tracker</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<div id="tm" role="timer" aria-live="off">
  <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="23" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="5"/><circle id="ring" cx="27" cy="27" r="23" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="0" transform="rotate(-90 27 27)"/></svg>
  <div style="flex:1"><div id="tl" style="font-size:13px"></div><b id="tt">0:00</b></div>
  <button data-a="add">+15s</button><button data-a="skip">Skip</button>
</div>
<nav></nav>
<script src="/api-config.js"></script>
<script src="/app.js"></script>
</body>
</html>
