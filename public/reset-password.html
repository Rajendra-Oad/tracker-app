<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="referrer" content="no-referrer">
<title>HTF | Choose a new password</title>
<link rel="stylesheet" href="/styles.css">
<script src="/api-config.js"></script>
<script src="/password-reset.js" defer></script>
</head>
<body class="password-page">
<main class="password-card">
  <a class="password-brand" href="/">HTF</a>
  <h1>Choose a new password</h1>
  <p class="password-lede">Reset links work once and expire after 30 minutes. Use a password you haven't used for another account.</p>
  <p id="reset-status" class="password-status" role="status" aria-live="polite"></p>
  <form id="reset-form" novalidate>
    <label for="new-password">New password</label>
    <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="password-guidance">
    <p id="password-guidance" class="password-hint">Use 8–128 characters and a mix of character types.</p>
    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <button class="p" type="submit">Update password</button>
  </form>
  <a id="request-another" class="password-back" href="/forgot-password.html" hidden>Request a new reset link</a>
  <div id="reset-success" class="password-success" role="status" aria-live="polite" hidden>
    <p>Your password has been updated. Sign in with your new password.</p>
    <a href="/">Go to login</a>
  </div>
</main>
</body>
</html>
