<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="referrer" content="no-referrer">
<title>HTF | Forgot password</title>
<link rel="stylesheet" href="/styles.css">
<script src="/api-config.js"></script>
<script src="/password-reset.js" defer></script>
</head>
<body class="password-page">
<main class="password-card">
  <a class="password-brand" href="/">HTF</a>
  <h1>Forgot your password?</h1>
  <p class="password-lede">Enter your account email. If an account exists, we'll try to send a one-use reset link. This page won't reveal whether the address is registered.</p>
  <form id="forgot-form" novalidate>
    <label for="reset-email">Email address</label>
    <input id="reset-email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <p id="forgot-status" class="password-status" role="status" aria-live="polite"></p>
    <button class="p" type="submit">Send reset link</button>
  </form>
  <a class="password-back" href="/">Back to login</a>
</main>
</body>
</html>
